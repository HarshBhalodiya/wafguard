submission:
  title: "WafGuard AI"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Semiconductor process and yield engineers face costly wafer lot rejections and yield drops at sub-5nm nodes due to multi-variable sensor drift and equipment anomalies across manufacturing steps. Diagnosing root causes manually takes weeks, leading to high scrap costs, material waste, and prolonged tool downtime.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    WafGuard AI is an AI-powered decision-support platform that unifies tabular equipment sensor telemetry, spatial wafer die patterns, and equipment health metrics. It uses XGBoost yield prediction, PyTorch CNN wafer defect classification with Grad-CAM, SHAP multi-signal root-cause attribution, and watsonx.ai to provide evidence-grounded engineering recommendations before wafers complete processing.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Real-time lot yield regression and low-yield risk scoring using XGBoost models"
    - "Multi-signal SHAP root cause candidate ranking combining telemetry deviations and equipment status"
    - "Spatial wafer pattern classification with OpenCV and PyTorch CNN featuring Grad-CAM defect heatmaps"
    - "Interactive What-If recipe simulator for testing parameter adjustments before running lots"
    - "Control-room 14-route React dashboard featuring Recharts/Plotly analytics and an evidence-grounded watsonx.ai Copilot"

  tech_stack:
    languages: ["Python", "JavaScript"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "PyTorch", "XGBoost", "scikit-learn"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["watsonx.ai", "IBM Cloud"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["MongoDB"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["OpenCV", "SHAP", "Recharts", "Plotly.js", "Tailwind CSS", "Pytest", "Vitest"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    We are most proud of building a fully end-to-end multi-modal platform that bridges complex tabular sensor streams, spatial visual wafer map failure modes (PyTorch CNN + Grad-CAM), and explainable SHAP multi-signal scoring into an interactive 14-route dashboard. Every risk score, root-cause candidate, and recommendation (such as diagnosing LOT_10901's RF-power drift on ETCH_007) is dynamically derived from live model inferences rather than hardcoded mock data.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    UCI SECOM and WM-811K public datasets are linked via a synthetic manufacturing layer; wafer pattern classification defaults to procedural synthetic maps unless Kaggle LSWMD.pkl is provided; root causes represent statistical model attributions rather than causal physical proof.

